<html>
<body>

    
    <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Oswald', sans-serif;
      background: url('https://www.shutterstock.com/shutterstock/photos/2188004839/display_1500/stock-vector-soccer-template-design-football-banner-sport-layout-design-green-theme-vector-illustration-2188004839.jpg') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1b0101;
    }

    /* Remove dark card background */
    form {
      padding: 50px 40px;
      border-radius: 20px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      background-color: transparent; /* Make container transparent */
      box-shadow: none; /* Remove shadow */
    }

    h2 {
      margin-bottom: 25px;
      font-size: 28px;
      color: #ffd700;
      text-shadow: 2px 2px 5px #000;
    }

    .input-field {
      position: relative;
      margin-bottom: 25px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.5);
      background-color: rgba(255,255,255,0.1); /* Slightly see-through */
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    input[type="text"]:focus {
      border-color: #ffd700;
      background-color: rgba(255,255,255,0.2);
    }

    label {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.7);
      pointer-events: none;
      transition: 0.3s;
    }

    input[type="text"]:focus + label,
    input[type="text"]:not(:placeholder-shown) + label {
      top: -10px;
      font-size: 12px;
      color: #ffd700;
    }

    input[type="submit"] {
      background: linear-gradient(to bottom, #05a1a7 0%, #17e9bb 100%);
      color: #000;
      border: none;
      padding: 5px 10px;
      font-size: 18px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px #b38600;
      transition: 0.2s;
      font-weight: bold;
    }

    input[type="submit"]:hover {
      background: linear-gradient(to bottom, #2cd1c9 0%, #14d1b2 100%);
    }

    input[type="submit"]:active {
      box-shadow: 0 3px #0bc0e0;
      transform: translateY(3px);
    }

    a {
      display: block;
      margin-top: 20px;
      color: #0ce679;
      text-decoration: none;
      font-weight: bold;
      text-shadow: 1px 1px 3px #000;
    }

    a:hover {
      text-decoration: underline;
    }
</style>



<FORM ACTION="displayplayer.jsp" method="get">
TeamName:<INPUT TYPE="text" NAME="name"><br>
<INPUT TYPE="submit" VALUE="search"><br>
<a href="teamdetails.jsp">go to team deatils page</a>
</FORM>
</body>
</html>
