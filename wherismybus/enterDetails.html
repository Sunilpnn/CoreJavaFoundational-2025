<!DOCTYPE html>
<html>
<head>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        h3 {
            margin-bottom: 20px;
            font-size: 26px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        form {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 30px 40px;
            width: 360px;
            color: #ffffff;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #f0f0f0;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: none;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 14px;
        }

        input[type="submit"],
        input[type="reset"] {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #00c9a7;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="reset"] {
            background-color: #f44336;
            margin-left: 10px;
        }

        input[type="submit"]:hover {
            background-color: #009e80;
        }

        input[type="reset"]:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>

    <form action ="busDetailsGet.jsp">
        <h3> ENTER THE BUS DETAILS BELOW</h3>
       
        <label for="name">1. Bus Name</label>
        <input type="text" name="name" />

        <label for="vehicleNumber">2. Vehicle Number</label>
        <input type="text" name="vehicleNumber" />

        <label for="numberOfSeats">3. Bus Seats</label>
        <input type="text" name="numberOfSeats" />

        <label for="DriverName">4. Driver Name</label>
        <input type="text" name="DriverName" />

        <label for="startDestination">5. Starting Destination</label>
        <input type="text" name="startDestination" />

        <label for="startTime">6. Start Time</label>
        <input type="text" name="startTime" />

        <label for="EndingBusDestination">7. Ending Destination</label>
        <input type="text" name="endingBusDestination" />

        <label for="endTime">8. End Time</label>
        <input type="text" name="endTime" />

        <input type="submit" name="submit" value="Save Bus Info" />
        <input type="reset" name="reset" value="Clear Bus Info" />
    </form>

</body>
</html>
